<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><title>משמרות – בית מאזן בטבע</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1d2a21; --muted:#56635a; --line:#d9dccf;
  --brand:#2f6b45; --brand-ink:#ffffff; --brand-soft:#e3f1e7;
  --ok:#1f7a3f; --ok-soft:#dff3e5; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fff2cf;
  --M:#a86b00; --M-soft:#fff3d6; --E:#b5482f; --E-soft:#fde6df; --N:#3a4aa3; --N-soft:#e4e8fb;
  --W:#6d757d; --W-bg:#ffffff; --G:#2c8a4f; --G-bg:#e2f4e8;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.admin{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f0b400;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}
.admin .wrap{max-width:1200px;padding-bottom:60px}
.topbar{background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar .logo{font-weight:700;font-size:1.05rem;flex:1;display:flex;gap:8px;align-items:center}
.topbar .logo small{font-weight:400;opacity:.85}
.fontbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-width:48px;height:44px;font-weight:700}
h1{font-size:1.6rem;margin:22px 0 6px}
h2{font-size:1.3rem;margin:0 0 4px}
h3{font-size:1.1rem;margin:0 0 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:12px;padding:10px 18px;min-height:48px;font-weight:500;background:#eceee6;color:var(--ink);text-decoration:none}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:#f0b7b2}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn.small{min-height:36px;padding:5px 12px;font-size:.92rem;border-radius:10px}
.btn.big{min-height:64px;font-size:1.25rem;padding:12px 28px;border-radius:16px;font-weight:700}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:500;background:#eceee6;white-space:nowrap}
.badge.open{background:var(--warn-soft);color:var(--warn)}
.badge.closed{background:#e8e6f6;color:#4a3f9a}
.badge.published{background:var(--ok-soft);color:var(--ok)}
.badge.hol{background:#f3e8ff;color:#6b2fa3}
.badge.W{background:#fff;color:#333;border:2px solid #9aa1a8}
.badge.G{background:var(--G);color:#fff;border:2px solid var(--G)}
.notice{border-radius:12px;padding:12px 14px;margin:12px 0}
.notice.ok{background:var(--ok-soft);color:#14512a}
.notice.warn{background:var(--warn-soft);color:#5e3d00}
.notice.bad{background:var(--bad-soft);color:#7d1a14}
.notice.info{background:#e7eef8;color:#1d3d66}
/* ── מסך מדריך ── */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-size:1.05rem}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.day{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0;border-inline-start:6px solid transparent}
.day.sat{border-inline-start-color:#8f7bd1;background:#fbfaff}
.day.past{opacity:.45}
.dayhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:10px}
.dayhead .dname{font-weight:700;font-size:1.15rem}
.dayhead .gdate{font-size:1.1rem}
.dayhead .hdate{color:var(--muted)}
.shiftbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{border:3px solid var(--line);background:#fff;border-radius:14px;min-height:92px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .05s}
.sbtn:active{transform:scale(.97)}
.sbtn .ic{font-size:1.5rem;line-height:1}
.sbtn .nm{font-weight:700;font-size:1.1rem}
.sbtn .hr{font-size:.78rem;color:var(--muted);direction:ltr;white-space:nowrap;letter-spacing:-.02em}
.sbtn .st{font-size:.8rem;font-weight:700;min-height:2.3em;line-height:1.15;color:var(--muted);display:flex;align-items:center;text-align:center}
.sbtn.no{border-color:var(--bad);background:var(--bad-soft)}
.sbtn.no .nm{text-decoration:line-through;text-decoration-thickness:2px}
.sbtn.no .st{color:var(--bad)}
.sbtn[disabled]{cursor:not-allowed}
.allday{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:.85rem;margin-inline-start:auto;min-height:36px}
.allday.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);font-weight:700}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);box-shadow:0 -4px 18px rgba(0,0,0,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30}
.sticky .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.sticky .cnt{flex:1;font-size:1.05rem}
.sticky .cnt b{font-size:1.4rem}
textarea.big,input.big,select.big{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.05rem;background:#fff}
textarea.big{min-height:110px;resize:vertical}
.myshift{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.myshift:last-child{border-bottom:0}
.myshift .date{flex:none;width:78px;text-align:center;border-radius:12px;background:#f1f2ec;padding:6px 4px}
.myshift .date b{display:block;font-size:1.5rem;line-height:1.1}
.myshift .date span{font-size:.8rem;color:var(--muted)}
.myshift .info{flex:1;min-width:0}
.myshift .info .s{font-weight:700;font-size:1.1rem}
.house{display:inline-block;border-radius:12px;padding:6px 14px;font-weight:700;font-size:1.05rem;white-space:nowrap}
.house.W{background:#fff;border:3px solid #8d959c;color:#2b2f33}
.house.G{background:var(--G);border:3px solid var(--G);color:#fff}
.success{text-align:center;padding:40px 16px}
.success .big-ic{font-size:4.5rem}
/* ── טפסים ── */
.field{margin:16px 0}
.field label.lb{display:block;font-weight:500;margin-bottom:6px;font-size:1.05rem}
.field .req{color:var(--bad)}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice button{flex:1;min-width:110px;min-height:54px;border:3px solid var(--line);background:#fff;border-radius:12px;font-weight:500}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.field.err input,.field.err textarea,.field.err select,.field.err .choice button{border-color:var(--bad)}
.field .errmsg{color:var(--bad);font-size:.9rem;margin-top:4px}
/* ── מנהל ── */
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:68px;z-index:19;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:14px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--brand);color:var(--ink)}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:.8rem;margin-inline-start:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.stat b{font-size:1.5rem;display:block}
.tablewrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:.92rem}
table.board th,table.board td{border-bottom:1px solid #eceee6;padding:4px;text-align:center}
table.board thead th{position:sticky;top:0;background:#f7f7f2;z-index:2}
table.board th.sM{background:var(--M-soft);color:var(--M)}
table.board th.sE{background:var(--E-soft);color:var(--E)}
table.board th.sN{background:var(--N-soft);color:var(--N)}
table.board th.hW{background:#fff;border-bottom:3px solid #9aa1a8}
table.board th.hG{background:var(--G-bg);border-bottom:3px solid var(--G)}
table.board td.dt{text-align:start;white-space:nowrap;padding:6px 10px;min-width:150px}
table.board td.dt .h{color:var(--muted);font-size:.82rem}
table.board tr.sat td{background:#faf8ff}
table.board td.sep{border-inline-start:2px solid #e2e4da}
.cell{width:100%;min-height:44px;border-radius:10px;border:2px solid transparent;padding:4px 6px;font-size:.9rem;line-height:1.2;background:#f4f5ef}
.cell.filled.W{background:#fff;border-color:#b9bfc4}
.cell.filled.G{background:var(--G-bg);border-color:#9fd3b0}
.cell.empty.cands{background:var(--warn-soft);border-color:#f0d58a;color:var(--warn);font-weight:700}
.cell.empty.none{background:var(--bad-soft);border-color:#efb9b4;color:var(--bad)}
.cell .wf{color:var(--warn);font-weight:700}
.cell .nr{font-size:.75rem;color:var(--muted);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.glist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
.gchip b{color:var(--brand)}
.reqrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #eef0e8}
.reqrow .when{min-width:210px;flex:1}
.cand{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.cand .nm{font-weight:700}
.cand .meta{font-size:.85rem;color:var(--muted)}
.cand .w{font-size:.85rem;color:var(--warn);width:100%}
.cand .nt{font-size:.85rem;background:#fffbe8;border-radius:8px;padding:4px 8px;width:100%}
.glistrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eef0e8}
.glistrow .nm{font-weight:700;min-width:160px}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.fieldedit{display:grid;grid-template-columns:auto 1fr 150px auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.fieldedit input[type=text],.fieldedit select{border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;background:#fff}
.fieldedit .opts{grid-column:2 / -1}
.fieldedit .mv{display:flex;flex-direction:column;gap:2px}
.fieldedit .mv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:32px;height:24px;padding:0;line-height:1}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:42px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f6f7f1;border:1px dashed #bfc5b5;border-radius:12px;padding:10px;word-break:break-all;font-size:.85rem;direction:ltr;text-align:left}
details>summary{cursor:pointer;font-weight:500;padding:6px 0}
/* ── חלון קופץ / הודעות ── */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;position:relative}
.modal .x{position:absolute;top:10px;left:10px;border:0;background:#f1f2ec;border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.modal h2{padding-left:44px}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-top:18px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:200;display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy .sp{background:#fff;border-radius:16px;padding:18px 26px;box-shadow:var(--shadow);font-size:1.1rem;display:flex;gap:12px;align-items:center}
#busy .sp::before{content:"";width:26px;height:26px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2a21;color:#fff;padding:12px 20px;border-radius:12px;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:600px){
  h1{font-size:1.4rem}
  .sbtn{min-height:84px}
  .sbtn .nm{font-size:1rem}
  .btn.big{width:100%}
  .fieldedit{grid-template-columns:auto 1fr;}
  .fieldedit .opts{grid-column:1 / -1}
  .kv{grid-template-columns:1fr}
  .tabs{top:64px}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html.admin{font-size:10px}
  body{background:#fff}
  .topbar,.tabs,.noprint,#toast,#busy{display:none!important}
  .tablewrap{box-shadow:none;overflow:visible}
  table.board{min-width:0}
  table.board thead th{position:static}
  .cell{min-height:0;border-width:1px}
  .printtitle{display:block!important;font-size:16px;font-weight:700;margin-bottom:6px}
}
.printtitle{display:none}
</style>
</head>

  (function go() {

        '<button style="font-size:1.2rem;padding:12px 24px;border-radius:12px;border:0;background:#2f6b45;color:#fff" onclick="location.reload()">לנסות שוב</button></div>';
    });
  })();
};
</script>
