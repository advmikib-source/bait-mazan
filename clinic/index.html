<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>קליניקה – בית מאזן בטבע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1d2a21; --muted:#56635a; --line:#d9dccf; --soft:#f1f2ec;
  --brand:#2f6b45; --brand-soft:#e3f1e7;
  --ok:#1f7a3f; --ok-soft:#dff3e5; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fff2cf; --info:#1d3d66; --info-soft:#e7eef8;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  --slot:20px;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.admin{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f0b400;outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
.admin .wrap{max-width:1280px}
.topbar{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;min-height:58px}
.topbar .logo{font-weight:700;font-size:1.05rem;flex:1;display:flex;gap:8px;align-items:center;min-width:0}
.topbar .logo small{font-weight:400;opacity:.85}
.live{font-size:.8rem;opacity:.9;white-space:nowrap;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#7CFC9a;box-shadow:0 0 0 3px rgba(124,252,154,.25)}
.live.off::before{background:#ffb4a8;box-shadow:none}
.fontbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-width:46px;height:42px;font-weight:700}
h1{font-size:1.55rem;margin:20px 0 6px}
h2{font-size:1.25rem;margin:0 0 6px}
h3{font-size:1.08rem;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:500;background:#eceee6;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:#f0b7b2}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.9rem;border-radius:10px}
.btn.big{min-height:60px;font-size:1.15rem;padding:10px 22px;border-radius:16px;font-weight:700}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:500;background:#eceee6;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.hol{background:#f3e8ff;color:#6b2fa3}
.badge.info{background:var(--info-soft);color:var(--info)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.notice{border-radius:12px;padding:12px 14px;margin:12px 0}
.notice.ok{background:var(--ok-soft);color:#14512a}
.notice.warn{background:var(--warn-soft);color:#5e3d00}
.notice.bad{background:var(--bad-soft);color:#7d1a14}
.notice.info{background:var(--info-soft);color:var(--info)}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:42px;max-width:100%}
.inp.w{width:100%}
label.lb{display:block;font-weight:500;margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
/* ── לשוניות מנהל ── */
.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:58px;z-index:25;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:13px 12px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--brand);color:var(--ink)}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:.78rem;margin-inline-start:4px}
.datenav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.datenav .title{font-size:1.3rem;font-weight:700}
.datenav .htitle{color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);min-width:120px}
.stat b{font-size:1.4rem;display:block;line-height:1.2}
/* ── עכשיו בקליניקה ── */
.nowstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:10px 0}
.nowcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;border-inline-start:6px solid #cfd3c6}
.nowcard.busy{border-inline-start-color:var(--brand)}
.nowcard .rn{font-weight:700}
.nowcard .who{font-size:1.02rem}
.nowcard .meta{font-size:.82rem;color:var(--muted)}
/* ── לוח יומי ── */
.daywrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);max-height:78vh;-webkit-overflow-scrolling:touch}
.dgrid{display:flex;min-width:max-content;position:relative}
.tcol{flex:none;width:58px;position:sticky;right:0;z-index:6;background:#fff;border-inline-end:1px solid var(--line)}
.rcol{flex:1 0 165px;min-width:165px;border-inline-end:1px solid #eceee6}
.chead{position:sticky;top:0;z-index:5;background:#f7f7f2;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;border-bottom:2px solid var(--line);padding:0 6px;text-align:center;line-height:1.1}
.tcol .chead{z-index:7}
.cbody{position:relative;cursor:copy;
  background-image:repeating-linear-gradient(to bottom,#e3e5dc 0,#e3e5dc 1px,transparent 1px,transparent calc(var(--slot)*4)),
                   repeating-linear-gradient(to bottom,#f3f4ef 0,#f3f4ef 1px,transparent 1px,transparent var(--slot))}
.tcol .cbody{cursor:default;background:none}
.tlabel{position:absolute;right:0;left:0;text-align:center;font-size:.78rem;color:var(--muted);transform:translateY(-50%)}
.sess{position:absolute;right:3px;left:3px;border-radius:9px;padding:3px 7px;font-size:.82rem;line-height:1.2;overflow:hidden;cursor:pointer;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.08)}
.sess:hover{filter:brightness(1.08);z-index:3}
.sess .t{font-weight:700;opacity:.95}
.sess .p{font-weight:500}
.sess .th{opacity:.92}
.sess .ok{position:absolute;top:3px;left:5px;background:#fff;color:var(--ok);border-radius:50%;width:18px;height:18px;font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.sess .rep{opacity:.8}
.sess.dim{opacity:.18}
.nowline{position:absolute;right:0;left:0;height:0;border-top:2px solid #e0362b;z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;right:-1px;top:-6px;width:10px;height:10px;background:#e0362b;border-radius:50%}
.slotghost{position:absolute;right:3px;left:3px;border:2px dashed var(--brand);border-radius:9px;background:rgba(47,107,69,.08);pointer-events:none;display:none;font-size:.78rem;color:var(--brand);padding:2px 6px}
/* ── שבועי ── */
.weekgrid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto}
.wday{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px;min-height:120px}
.wday.today{outline:3px solid var(--brand)}
.wday h3{margin:0;cursor:pointer}
.wday .h{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.chip{display:block;width:100%;text-align:start;border:1px solid var(--line);border-inline-start:5px solid var(--c,#999);background:#fff;border-radius:10px;padding:5px 8px;margin:5px 0;font-size:.85rem;line-height:1.25}
.chip:hover{background:#f8f9f4}
.chip b{font-weight:700}
.chip .s{color:var(--muted)}
/* ── רשימות ── */
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eef0e8}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-weight:700;min-width:150px}
.lrow.off{opacity:.55}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid #eef0e8;text-align:start;vertical-align:middle}
.tbl th{font-size:.85rem;color:var(--muted);font-weight:500}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f6f7f1;border:1px dashed #bfc5b5;border-radius:12px;padding:10px;word-break:break-all;font-size:.85rem;direction:ltr;text-align:left}
.msgprev{white-space:pre-wrap;background:#e7fbe9;border-radius:12px;padding:12px;font-size:.95rem;border:1px solid #c5ebcb;max-height:50vh;overflow:auto}
details>summary{cursor:pointer;font-weight:500;padding:6px 0}
.pchips{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fafbf7}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 4px 3px 10px;font-weight:500;font-size:.92rem}
.pchip.new{background:var(--warn-soft);color:var(--warn)}
.pchip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;font-size:.75rem;line-height:1;padding:0;color:inherit}
.picklist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.pickhead{position:sticky;top:0;background:#f1f2ec;font-weight:700;padding:6px 10px;font-size:.88rem}
.pickrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #f0f1ea;cursor:pointer}
.pickrow:hover{background:#f8f9f4}
.pickrow input{width:20px;height:20px;flex:none}
.tsess .mem{font-size:.92rem;color:var(--muted)}
/* ── מסך מטפל ── */
.daycard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:14px 0}
.daycard.today{border:3px solid var(--brand)}
.daycard .dh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
.daycard .dh b{font-size:1.15rem}
.tsess{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #eef0e8;flex-wrap:wrap}
.tsess:first-of-type{border-top:0}
.tsess .tm{flex:none;width:86px;text-align:center;border-radius:12px;background:var(--soft);padding:6px 4px}
.tsess .tm b{display:block;font-size:1.35rem;line-height:1.1}
.tsess .tm span{font-size:.82rem;color:var(--muted)}
.tsess .inf{flex:1;min-width:150px}
.tsess .inf .pt{font-weight:700;font-size:1.15rem}
.roomtag{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:2px 10px;font-weight:700}
.tsess.now{background:#f2fbf4;border-radius:12px;padding:12px 8px}
.docbtn{width:100%;min-height:54px;border-radius:14px;border:3px solid var(--brand);background:#fff;color:var(--brand);font-weight:700;font-size:1.05rem}
.docbtn.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.pendcard{background:var(--bad-soft);border:2px solid #f0b7b2;border-radius:var(--radius);padding:14px;margin:14px 0}
.pendcard h2{color:var(--bad)}
.pendcard .tsess{border-top-color:#f3cfcb}
/* ── חלון קופץ / הודעות ── */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;position:relative}
.modal .x{position:absolute;top:10px;left:10px;border:0;background:#f1f2ec;border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.modal h2{padding-left:44px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:200;display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy .sp{background:#fff;border-radius:16px;padding:16px 24px;box-shadow:var(--shadow);font-size:1.05rem;display:flex;gap:12px;align-items:center}
#busy .sp::before{content:"";width:24px;height:24px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2a21;color:#fff;padding:12px 20px;border-radius:12px;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.center{text-align:center;padding:50px 16px}
.center .ic{font-size:4rem}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  h1{font-size:1.35rem}
  .datenav .title{font-size:1.1rem}
  .rcol{flex-basis:140px;min-width:140px}
  .weekgrid{grid-template-columns:1fr}
  .live span{display:none}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html.admin{font-size:10px}
  body{background:#fff}
  .topbar,.tabs,.noprint,#toast,#busy,.nowstrip{display:none!important}
  .daywrap{max-height:none;overflow:visible;box-shadow:none}
  .chead{position:static}
}
</style>
</head>

/* ═════════════ הפעלה ═════════════ */
function simple(icon, title, text) {
  clear($app);
  put($app, [topbar('קליניקה'), el('div', { class: 'wrap' }, el('div', { class: 'center' }, el('div', { class: 'ic', text: icon }), el('h1', { text: title }), text ? el('p', { class: 'muted', text: text }) : null))]);

function params() {

    var i = kv.indexOf('=');

}
function start() {
