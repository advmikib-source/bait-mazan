<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f6b45">
<title>התלמדות – בית מאזן בטבע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1d2a21; --muted:#56635a; --line:#d9dccf; --soft:#f1f2ec;
  --brand:#2f6b45; --brand-soft:#e3f1e7;
  --ok:#1f7a3f; --ok-soft:#dff3e5; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fff2cf; --info:#1d3d66; --info-soft:#e7eef8;
  --done:#0f5132; --plan:#7cc49a; --pend:#f2c14e;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.admin{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f0b400;outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
.admin .wrap{max-width:1280px;padding-bottom:60px}
.topbar{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;min-height:58px}
.topbar .logo{font-weight:700;font-size:1.05rem;flex:1;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .logo small{font-weight:400;opacity:.85}
.live{font-size:.8rem;opacity:.9;white-space:nowrap;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#7CFC9a;box-shadow:0 0 0 3px rgba(124,252,154,.25)}
.live.off::before{background:#ffb4a8;box-shadow:none}
.fontbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-width:46px;height:42px;font-weight:700}
h1{font-size:1.55rem;margin:20px 0 6px}
h2{font-size:1.25rem;margin:0 0 8px}
h3{font-size:1.08rem;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:500;background:#eceee6;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:#f0b7b2}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.9rem;border-radius:10px}
.btn.big{min-height:60px;font-size:1.15rem;padding:10px 22px;border-radius:16px;font-weight:700}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:500;background:#eceee6;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.done{background:var(--done);color:#fff}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.hol{background:#f3e8ff;color:#6b2fa3}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.gray{background:#eceee6;color:var(--muted)}
.notice{border-radius:12px;padding:12px 14px;margin:12px 0}
.notice.ok{background:var(--ok-soft);color:#14512a}
.notice.warn{background:var(--warn-soft);color:#5e3d00}
.notice.bad{background:var(--bad-soft);color:#7d1a14}
.notice.info{background:var(--info-soft);color:var(--info)}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:42px;max-width:100%}
.inp.w{width:100%}
label.lb{display:block;font-weight:500;margin:12px 0 5px}
/* ── התקדמות ── */
.prog{height:16px;border-radius:999px;background:#e9ebe3;overflow:hidden;display:flex;position:relative}
.prog.big{height:26px}
.prog i{display:block;height:100%}
.prog .a{background:var(--done)}
.prog .p{background:var(--plan)}
.prog .q{background:repeating-linear-gradient(45deg,var(--pend),var(--pend) 6px,#f7d77f 6px,#f7d77f 12px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hero b{font-size:2.4rem;line-height:1;color:var(--brand)}
.hero span{font-size:1.1rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--soft);border-radius:12px;padding:8px 12px}
.kpi b{display:block;font-size:1.3rem}
.kpi span{font-size:.85rem;color:var(--muted)}
.celebrate{background:linear-gradient(135deg,#e3f1e7,#fff6d8);border:2px solid #b7dfc3;text-align:center;padding:22px}
.celebrate .ic{font-size:3.5rem}
/* ── כרטיס מועד (מתלמד) ── */
.sl{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #eef0e8;flex-wrap:wrap}
.sl:first-child{border-top:0}
.sl .dt{flex:none;width:84px;text-align:center;border-radius:12px;background:var(--soft);padding:6px 4px;line-height:1.15}
.sl .dt b{display:block;font-size:1.35rem}
.sl .dt span{font-size:.8rem;color:var(--muted)}
.sl .inf{flex:1;min-width:170px}
.sl .inf .bl{font-weight:700;font-size:1.08rem}
.sl.today{background:#f2fbf4;border-radius:12px;padding:12px 8px}
.sl .acts{display:flex;gap:6px;flex-wrap:wrap}
/* ── לוח בחירת מועדים ── */
.calnav{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.calnav .t{flex:1;text-align:center}
.calnav .t b{display:block;font-size:1.2rem}
.calnav .t span{font-size:.9rem;color:var(--muted)}
.calnav .btn{min-width:52px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cal .hd{text-align:center;font-weight:700;color:var(--muted);font-size:.9rem;padding:4px 0}
.day{position:relative;min-height:78px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.day .gn{font-size:1.35rem;font-weight:700}
.day .hn{font-size:.78rem;color:var(--muted)}
.day .tg{font-size:.7rem;border-radius:6px;padding:0 4px;background:#f3e8ff;color:#6b2fa3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .mk{font-size:.78rem;font-weight:700}
.day.blank{border:0;background:transparent}
.day.off{background:#efefea;color:#9aa096;border-color:#e4e5de;cursor:not-allowed}
.day.off .hn{color:#a8ada4}
.day.today{box-shadow:0 0 0 3px #f0b400 inset}
.day.has{border-color:var(--plan)}
.day.sel{border-color:var(--brand);background:var(--brand-soft)}
.day.sel .mk{color:var(--brand)}
.blockbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;min-height:70px}
.blockbtn .ic{font-size:1.8rem}
.blockbtn b{display:block;font-size:1.15rem}
.blockbtn .why{font-size:.85rem;color:var(--muted)}
.blockbtn.on{border-color:var(--brand);background:var(--brand-soft)}
.blockbtn.on .ck{display:flex}
.blockbtn .ck{display:none;margin-inline-start:auto;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-weight:700}
.blockbtn[disabled]{opacity:.5;cursor:not-allowed;background:#f4f4f0}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 18px rgba(0,0,0,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40}
.cartbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cartbar .sum{flex:1;min-width:150px}
.cartbar .sum b{font-size:1.1rem}
/* ── טופס הרשמה ── */
.field{margin-bottom:6px}
.req{color:var(--bad)}
input.big,select.big,textarea.big{width:100%;font-size:1.05rem;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:52px}
textarea.big{min-height:96px;resize:vertical}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{flex:1;min-width:90px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:500}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.field.err input,.field.err select,.field.err textarea,.field.err .choice button{border-color:var(--bad)}
.errmsg{color:var(--bad);font-size:.9rem;margin-top:4px}
/* ── מנהל ── */
.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:58px;z-index:25;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:13px 12px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--brand);color:var(--ink)}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:.78rem;margin-inline-start:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:start;border-inline-start:6px solid var(--c,#cfd3c6)}
button.stat:hover{filter:brightness(.98)}
.stat b{font-size:1.8rem;display:block;line-height:1.15}
.stat span{color:var(--muted);font-size:.9rem}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.alert.gold{background:linear-gradient(135deg,#fff6d8,#e3f1e7);border:2px solid #e5c76b}
.alert.red{background:var(--bad-soft);border:1px solid #f0b7b2}
.alert.green{background:#e7fbe9;border:1px solid #bfe8c6}
.alert .ic{font-size:1.6rem}
.alert .tx{flex:1;min-width:200px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid #eef0e8;text-align:start;vertical-align:middle}
.tbl th{font-size:.85rem;color:var(--muted);font-weight:500;white-space:nowrap}
.tbl tr.done td{background:#f5fbf6}
.tbl .nm{font-weight:700;cursor:pointer}
.tbl .nm:hover{text-decoration:underline}
.pcell{min-width:180px}
.pcell .t{font-size:.82rem;color:var(--muted);margin-top:3px}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.9rem}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eef0e8}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-weight:700;min-width:140px}
.grp{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:#fff}
.grp h3{margin:0}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px dashed #e3e5dc}
.srow:first-child{border-top:0}
.srow .w{min-width:150px;font-weight:500}
.srow .b{min-width:150px}
.srow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.srow .meta{font-size:.82rem;color:var(--muted)}
/* לוח חודשי – מנהל */
.acal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.acal .hd{text-align:center;font-weight:700;color:var(--muted);padding:4px 0}
.aday{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:6px;min-height:118px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:3px;min-width:0}
.aday:hover{border-color:#c7d6c9}
.aday.blank{background:transparent;box-shadow:none;cursor:default}
.aday.today{border-color:#f0b400}
.aday.closed{background:#efefea}
.aday .dh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.aday .dh b{font-size:1.1rem}
.aday .dh span{font-size:.75rem;color:var(--muted)}
.aday .tg{font-size:.7rem;border-radius:6px;padding:0 5px;background:#f3e8ff;color:#6b2fa3;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aday .tg.cl{background:#e2e3dc;color:#555}
.ach{font-size:.76rem;border-radius:7px;padding:2px 5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.ach.pending{background:var(--warn-soft);border:1px dashed #d8a93b;color:#5e3d00}
.ach.approved{background:var(--ok-soft);color:#14512a}
.ach.attended{background:var(--done);color:#fff}
.ach.absent{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.acnt{display:none;font-size:.78rem;font-weight:700}
.aday .more{font-size:.74rem;color:var(--muted)}
/* חלונות */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;position:relative}
.modal.wide{max-width:900px}
.modal .x{position:absolute;top:10px;left:10px;border:0;background:#f1f2ec;border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.modal h2{padding-left:44px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:200;display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy .sp{background:#fff;border-radius:16px;padding:16px 24px;box-shadow:var(--shadow);font-size:1.05rem;display:flex;gap:12px;align-items:center}
#busy .sp::before{content:"";width:24px;height:24px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1d2a21;color:#fff;padding:12px 20px;border-radius:12px;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f6f7f1;border:1px dashed #bfc5b5;border-radius:12px;padding:10px;word-break:break-all;font-size:.85rem;direction:ltr;text-align:left}
.msgprev{white-space:pre-wrap;background:#e7fbe9;border-radius:12px;padding:12px;font-size:.95rem;border:1px solid #c5ebcb;max-height:46vh;overflow:auto;margin:0}
details>summary{cursor:pointer;font-weight:500;padding:6px 0}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px;margin:8px 0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;word-break:break-word}
.fieldedit{display:grid;grid-template-columns:auto 1fr 150px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eef0e8}
.fieldedit input[type=text],.fieldedit select{border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-height:40px;width:100%}
.fieldedit .opts{grid-column:2/-1}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:22px;font-size:.7rem;padding:0}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.center{text-align:center;padding:50px 16px}
.center .ic{font-size:4rem}
@media (max-width:700px){
  h1{font-size:1.35rem}
  .day{min-height:70px}
  .day .gn{font-size:1.15rem}
  .day .tg{display:none}
  .ach,.aday .more{display:none}
  .acnt{display:block}
  .aday{min-height:84px;padding:4px}
  .aday .dh{flex-direction:column;gap:0}
  .aday .dh span{font-size:.62rem}
  .live span{display:none}
  .fieldedit{grid-template-columns:auto 1fr auto}
  .fieldedit select{grid-column:2/-1}
  dl.kv{grid-template-columns:1fr}
  .topbar .logo small{display:none}
}
@media print{
  html.admin{font-size:11px}
  body{background:#fff}
  .topbar,.tabs,.noprint,#toast,#busy{display:none!important}
  .card,.stat,.aday{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="busy"><div class="sp">רגע…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwlKdy_P_TyFm5wxOW09OWFdiThT9GYzE3b5bYxBnpfe1g8_lF3mnLRXGct9ZcbNs_c/exec';
// סביבת פיתוח מקומית: כשהדף נטען בתוך סביבת הבדיקה, ה-API מגיע ממנה
try { if (API_URL.indexOf('__') === 0 && window.parent !== window && window.parent.__DEV) window.DEV = window.parent.__DEV; } catch (e) {}
</script>

  });
  for (var i = 2; i < arguments.length; i++) put(n, arguments[i]);
  return n;
}

  n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
function ls(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem('bmt_' + k) || 'null');
    if (v === null) localStorage.removeItem('bmt_' + k); else localStorage.setItem('bmt_' + k, JSON.stringify(v));
  } catch (e) { return null; }
}
var busyN = 0;
function busy(on, text) {
  busyN += on ? 1 : -1; if (busyN < 0) busyN = 0;
  var b = document.getElementById('busy');
  b.querySelector('.sp').textContent = text || 'רגע…';
  b.classList.toggle('on', busyN > 0);
}
var toastT;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3400);
}
function call(action, payload) {
  if (window.DEV) return window.DEV.call(action, BOOT && BOOT.auth || '', payload || {});

      run('adminSaveSettings', { settings: p }, 'שומר…').then(function (r) { if (r) { toast('ההגדרות נשמרו ✓'); reload(); } });

  var rI = el('input', { class: 'inp', type: 'text', maxlength: '80', placeholder: 'סיבה (לדוגמה: יום גיבוש)', style: 'min-width:220px' });

  var card = el('div', { class: 'card' }, el('h2', { text: '🔒 ימים סגורים להתלמדות' }),
    el('p', { class: 'muted', style: 'margin-top:0', text: 'ימי שישי, שבת וחגים (ראש השנה, יום כיפור, סוכות, שמחת תורה, פסח, שביעי של פסח, שבועות ויום העצמאות) סגורים אוטומטית. כאן אפשר לסגור ימים נוספים.' }),
    el('div', { class: 'row' }, dI, rI, el('button', { class: 'btn primary sm', onclick: function () {

    } }, '🔒 סגירת יום')));

    el('li', { text: 'אחרי כל מועד מסמנים נוכחות בלשונית "נוכחות". השעות נספרות רק אחרי הסימון.' }),
    el('li', { text: 'כשמתלמד/ת מגיע/ה ל-30 שעות – מופיעה התראה בדשבורד "המטלה בוצעה" 🎓.' })),
    el('p', { class: 'muted small', text: 'גרסה ' + AD.d.version })));

/* ═════════════ מסכים נוספים וניתוב ═════════════ */
function simple(icon, title, text, extra) {
  applyFont();
  clear($app).appendChild(el('div', {}, topbar('התלמדות'), el('div', { class: 'wrap' }, el('div', { class: 'card center', style: 'margin-top:24px;padding:30px 16px' },
    el('div', { class: 'ic', text: icon }), el('h1', { text: title }), el('p', { style: 'font-size:1.15rem', text: text }), extra))));
}
function parseQuery() {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('=');
    q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
  });
  return q;
}
function start() {
  if (BOOT.mode === 'admin') adminStart();
  else if (BOOT.mode === 'trainee') trStart();
  else if (BOOT.mode === 'register') registerStart();
  else if (BOOT.mode === 'denied') simple('🔒', 'הקישור אינו תקין', 'נא לפתוח את קישור המנהל המלא.');
  else simple('🌿', 'התלמדות בבית מאזן בטבע', 'כדי להיכנס יש לפתוח את הקישור האישי שנשלח אליך בוואטסאפ.',
    el('a', { class: 'btn big primary', href: regLink() }, 'מתלמד/ת חדש/ה? להרשמה'));
}
function boot() {
  var q = parseQuery();
  if (window.DEV) { BOOT = window.DEV.boot(q); start(); return; }
  if (!q.admin && !q.t) { BOOT = { mode: q.reg !== undefined ? 'register' : 'home' }; start(); return; }
  $app.innerHTML = '<div style="padding:60px 20px;text-align:center;font-size:1.3rem;color:#2f6b45">🌿 טוען…</div>';
  var tries = 0;
  (function go() {
    fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'boot', params: q }) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.error) || 'boot');
      BOOT = r.data; $app.innerHTML = ''; start();
    })
    .catch(function () {
      if (++tries < 3) return setTimeout(go, 1500);
      $app.innerHTML = '';
      put($app, el('div', { class: 'center' }, el('p', { style: 'font-size:1.2rem', text: 'אין חיבור לשרת כרגע.' }),
        el('button', { class: 'btn primary big', onclick: function () { location.reload(); } }, 'לנסות שוב')));
    });
  })();
}
window.__app = { holiday: holiday, holidayClosed: holidayClosed, hDate: hDate, hMonthRange: hMonthRange, monthWeeks: monthWeeks };
boot();
})();
